name: medmotion
description: >-
  MedMotion (复动肌骨 / 复动医疗, Shanghai Fudong Medical Management Co.) is a China-based
  musculoskeletal medical company founded in 2018 in Shanghai, building an integrated
  orthopedic, rehabilitation, orthotics, and physical-conditioning care model for
  conservative treatment and pre-/post-surgical recovery of sports and skeletal injuries.
  It operates three product lines: offline musculoskeletal rehabilitation medical centers,
  the PhysioCloud cloud service platform, and the NMPA-approved TELEREHAB (悦行) musculoskeletal
  digital-therapeutics device. It is backed by Qiming Venture Partners (Pre-A lead), TF Capital,
  and SunMed Capital. As of this enrichment pass MedMotion publishes a patient/clinic-facing
  marketing site and app backend but no public developer API, OpenAPI specification, SDKs, or
  developer portal, so no API artifacts were harvested.
